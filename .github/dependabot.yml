version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Give fresh releases a few days to surface regressions or a compromised
    # publish before a PR is opened.
    cooldown:
      default-days: 3
      semver-major-days: 14
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # typescript-eslint caps its peer range at the TypeScript versions it
      # supports; drop this once it accepts the next major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Keep the Node types on the major we actually run (see release.yml).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # The JS API/plugins must stay in step with the Rust `tauri*` crates.
      tauri:
        patterns:
          - "@tauri-apps/*"
      npm-minor-patch:
        # Needed so the `tauri` group above wins: Dependabot treats a group with
        # no patterns as more specific than any wildcard pattern.
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directories:
      - "/src-tauri"
      - "/driver"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 14
    commit-message:
      prefix: "chore(deps)"
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
      cargo-minor-patch:
        # Needed so the `tauri` group above wins: Dependabot treats a group with
        # no patterns as more specific than any wildcard pattern.
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
